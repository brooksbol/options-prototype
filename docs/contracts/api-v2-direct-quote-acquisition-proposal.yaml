  /v2/quotes:
    get:
      operationId: listHeldDirectQuotes
      summary: List held direct quotes
      description: 'Held-evidence reads never acquire or revalidate evidence. This GET causes no upstream provider contact, acquisition, worker/enrollment/membership changes, Decision traversal, or freshness/reuse evaluation. Enumerates all direct_quote holdings independently of membership, age, reuse eligibility and active provider environment. One committed discovery item per canonical symbol, deterministic uppercase ordinal symbol ascending, no history. No body/query parameters: any parameter presence or nonempty body is 422. No limit, pagination, filtering, sort/projection parameters, ETag or 304; If-None-Match is ignored. POST''s 30-subject cap does not apply. Entire result is materialized/validated/serialized before success. Concurrent replacement can return old or new complete committed version, never both/torn/uncommitted; continuously held subjects are included. Concurrent insert/remove may appear or be absent; no collection-wide single-instant snapshot is promised. See api-v2-held-quotes-read.md
        for the normative enumeration interval and CLI contract. No automatic read/acquire privilege inheritance.


        <!-- internal-only:start -->

        Authenticate, authorize quote.read, then validate and enumerate.

        <!-- internal-only:end -->'
      security:
      - bearerAuth: []
      x-required-grants:
      - quote.read
      x-unsupported-query-parameters: Any query parameter presence is INVALID_REQUEST/422, including empty and repeated parameters.
      parameters:
      - name: X-Request-Id
        in: header
        required: false
        description: Single optional UUID (hex 8-4-4-4-12, case insensitive), surrounding whitespace trimmed and echoed. Absent/blank generates one. Multiple or nonblank invalid values are 422 after auth/authorization; errors use a generated valid UUID. Correlation only, never idempotency.
        schema:
          type: string
          pattern: ^\s*([0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12})?\s*$
        example: 11111111-1111-4111-8111-111111111111
      responses:
        '200':
          description: Complete current canonical quote-holdings inventory, ordered by uppercase symbol; empty items is successful. Complete committed items, no collection-wide single-instant snapshot guarantee.
          headers:
            X-Request-Id: &id001
              required: true
              schema:
                type: string
                format: uuid
            Cache-Control: &id002
              required: true
              schema:
                type: string
                const: private, no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HeldQuotesReadResponse'
              examples:
                synthetic:
                  summary: Invented data only
                  value:
                    requestId: 11111111-1111-4111-8111-111111111111
                    items:
                    - observationId: 22222222-2222-4222-8222-222222222222
                      subject:
                        symbol: SPY
                        securityType: ETF
                      provenance:
                        provider: tradier
                        environment: SANDBOX
                        receivedAt: '2026-10-15T20:00:00Z'
                        committedAt: '2026-10-15T20:00:00Z'
        '401':
          description: Missing or invalid Bearer credential.
          headers:
            X-Request-Id: *id001
            Cache-Control: *id002
            WWW-Authenticate:
              required: true
              schema:
                type: string
                const: Bearer
          content:
            application/problem+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/HeldQuotesReadProblem'
                - type: object
                  properties:
                    status:
                      const: 401
                    code:
                      const: UNAUTHENTICATED
              examples:
                synthetic:
                  summary: Invented data only
                  value:
                    type: urn:wheelwright:problem:unauthenticated
                    title: Unauthenticated
                    status: 401
                    code: UNAUTHENTICATED
                    requestId: 11111111-1111-4111-8111-111111111111
                    detail: Synthetic 401 example.
        '403':
          description: Authenticated principal lacks quote.read; acquire/force grants do not imply read.
          headers:
            X-Request-Id: *id001
            Cache-Control: *id002
          content:
            application/problem+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/HeldQuotesReadProblem'
                - type: object
                  properties:
                    status:
                      const: 403
                    code:
                      const: FORBIDDEN
              examples:
                synthetic:
                  summary: Invented data only
                  value:
                    type: urn:wheelwright:problem:forbidden
                    title: Forbidden
                    status: 403
                    code: FORBIDDEN
                    requestId: 11111111-1111-4111-8111-111111111111
                    detail: Synthetic 403 example.
        '422':
          description: Invalid correlation, any query parameter, or nonempty GET body.
          headers:
            X-Request-Id: *id001
            Cache-Control: *id002
          content:
            application/problem+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/HeldQuotesReadProblem'
                - type: object
                  properties:
                    status:
                      const: 422
                    code:
                      const: INVALID_REQUEST
              examples:
                synthetic:
                  summary: Invented data only
                  value:
                    type: urn:wheelwright:problem:invalid_request
                    title: Invalid request
                    status: 422
                    code: INVALID_REQUEST
                    requestId: 11111111-1111-4111-8111-111111111111
                    detail: Synthetic 422 example.
                    invalidParams:
                    - name: request
                      reason: Synthetic invalid input
        '500':
          description: Unexpected storage, enumeration, discovery mapping or serialization failure; never partial inventory or empty substitution.
          headers:
            X-Request-Id: *id001
            Cache-Control: *id002
          content:
            application/problem+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/HeldQuotesReadProblem'
                - type: object
                  properties:
                    status:
                      const: 500
                    code:
                      const: INTERNAL_ERROR
              examples:
                synthetic:
                  summary: Invented data only
                  value:
                    type: urn:wheelwright:problem:internal_error
                    title: Internal error
                    status: 500
                    code: INTERNAL_ERROR
                    requestId: 11111111-1111-4111-8111-111111111111
                    detail: Synthetic 500 example.
        '503':
          description: 'Read cannot start: approved authentication or held storage unavailable. Provider outage alone does not cause this error.'
          headers:
            X-Request-Id: *id001
            Cache-Control: *id002
          content:
            application/problem+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/HeldQuotesReadProblem'
                - type: object
                  properties:
                    status:
                      const: 503
                    code:
                      const: CAPABILITY_UNAVAILABLE
              examples:
                synthetic:
                  summary: Invented data only
                  value:
                    type: urn:wheelwright:problem:capability_unavailable
                    title: Capability unavailable
                    status: 503
                    code: CAPABILITY_UNAVAILABLE
                    requestId: 11111111-1111-4111-8111-111111111111
                    detail: Synthetic 503 example.
      tags:
      - Quotes
      externalDocs:
        description: Product and domain contract
        url: https://github.com/brooksbol/options-prototype/blob/main/docs/contracts/api-v2-held-quotes-read.md
      x-codeSamples:
      - lang: curl
        label: Synthetic cURL
        source: "curl --request GET 'https://api.example.invalid/v2/quotes' \\\n  --header 'X-Request-Id: 11111111-1111-4111-8111-111111111111'"
    post:
      operationId: acquireDirectQuotes
      summary: Acquire or revalidate direct quotes
      description: Returns only when every requested subject has a terminal result. HTTP 200 denotes a completed operation, not fulfillment of every subject. Repeating ORDINARY reevaluates held-evidence reuse; repeating FORCE may cause another upstream attempt. X-Request-Id correlates but does not deduplicate. FORCE bypasses reuse, not provider-contact restrictions. Backend contact policy still applies at actual contact, including disabled off-hours contact. CONTACT_NOT_PERMITTED means policy prevented contact; UPSTREAM_UNAVAILABLE means the upstream source is unavailable for this attempt. Neither outcome is fulfilled, and retained prior evidence does not change that.
      security:
      - bearerAuth: []
      parameters:
      - name: X-Request-Id
        in: header
        required: false
        description: Optional caller UUID for correlation only; surrounding whitespace is trimmed and echoed. Absent or blank generates one. Not an idempotency key.
        schema:
          type: string
          pattern: ^\s*([0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12})?\s*$
        example: 11111111-1111-4111-8111-111111111111
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcquireQuotesRequest'
            example:
              subjects:
              - symbol: SPY
              mode: ORDINARY
      responses:
        '200':
          description: All subjects have terminal independent results; some or all may fail.
          headers:
            X-Request-Id:
              required: true
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcquireQuotesResponse'
              examples:
                synthetic:
                  summary: Invented data only
                  value:
                    requestId: 11111111-1111-4111-8111-111111111111
                    mode: ORDINARY
                    startedAt: '2026-10-15T20:00:00Z'
                    completedAt: '2026-10-15T20:00:00Z'
                    results:
                    - subject:
                        symbol: SPY
                      outcome: NEWLY_ACQUIRED
                      fulfilled: true
                      observation:
                        observationId: 22222222-2222-4222-8222-222222222222
                        subject:
                          symbol: SPY
                          securityType: ETF
                        facts:
                          last:
                            price: 100
                          bid:
                            price: 99.9
                          ask:
                            price: 100.1
                        provenance:
                          provider: tradier
                          environment: SANDBOX
                          acquisitionId: 22222222-2222-4222-8222-222222222222
                          authorityEpoch: synthetic-epoch
                          acquisitionPhase: CLOSED
                          receivedAt: '2026-10-15T20:00:00Z'
                          committedAt: '2026-10-15T20:00:00Z'
                      priorRetained: false
        '400':
          $ref: '#/components/responses/Problem400'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '415':
          $ref: '#/components/responses/Problem415'
        '422':
          $ref: '#/components/responses/Problem422'
        '500':
          $ref: '#/components/responses/Problem500'
        '503':
          $ref: '#/components/responses/Problem503'
      tags:
      - Quotes
      externalDocs:
        description: Product and domain contract
        url: https://github.com/brooksbol/options-prototype/blob/main/docs/contracts/api-v2-direct-quote-acquisition-proposal.md
      x-codeSamples:
      - lang: curl
        label: Synthetic cURL
        source: "curl --request POST 'https://api.example.invalid/v2/quotes' \\\n  --header 'X-Request-Id: 11111111-1111-4111-8111-111111111111' \\\n  --header 'Content-Type: application/json' \\\n  --data-raw '{\"subjects\":[{\"symbol\":\"SPY\"}],\"mode\":\"ORDINARY\"}'"
  /v2/quotes/{symbol}:
    get:
      operationId: readHeldDirectQuote
      summary: Read a held direct quote
      description: 'Pure held-evidence read: no acquisition, provider contact, reuse evaluation or evidence mutation. Decode the canonical path-symbol token exactly once before lookup. Complete strict persisted validation precedes response/projection; malformed present optional fields are INTERNAL_ERROR, not repaired or dropped. Valid unheld canonical subject is NOT_FOUND. Preserves original identity, facts and provenance. Query parameters/nonempty body are INVALID_REQUEST. No history, ETag, 304, redirect or fallback; If-None-Match is ignored. Standard container defaults remain unchanged. Canonical subject length is 1–32; encoded token length is 1–96. See ww-show-held-quote-transport-reconciliation.md for normative codec rules.


        <!-- internal-only:start -->

        Pure held-evidence read using quote.read; never acquire, refresh, contact providers/workers, evaluate acquisition reuse, mutate evidence or substitute legacy evidence. Decode the canonical path-symbol token exactly once after authentication/authorization, before independent committed-row lookup.

        <!-- internal-only:end -->'
      security:
      - bearerAuth: []
      x-required-grants:
      - quote.read
      x-unsupported-query-parameters: Any query parameter presence is INVALID_REQUEST/422, including empty and repeated parameters.
      parameters:
      - name: symbol
        in: path
        required: true
        style: simple
        explode: false
        description: Canonical path-symbol transport token, not persisted/provider identity. SPY -> SPY; BRK/B -> BRK_2FB; literal BRK_2FB -> BRK_5F2FB; ^SPX -> _5ESPX. No other or unnecessary/lowercase escape is accepted; do not recursively decode output or URLDecode a bound token. Returned subject.symbol is canonical decoded identity.
        schema:
          $ref: '#/components/schemas/EncodedQuoteSymbol'
        examples:
          ordinary:
            value: SPY
          slash:
            value: BRK_2FB
          literalUnderscore:
            value: BRK_5F2FB
          caret:
            value: _5ESPX
        example: SPY
      - name: X-Request-Id
        in: header
        required: false
        description: Single optional UUID (hex 8-4-4-4-12, case insensitive), surrounding whitespace trimmed and echoed. Absent/blank generates one. Multiple or nonblank invalid values are 422 after auth/authorization; errors use a generated valid UUID. Correlation only, never idempotency.
        schema:
          type: string
          pattern: ^\s*([0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12})?\s*$
        example: 11111111-1111-4111-8111-111111111111
      responses:
        '200':
          description: Complete canonical observation from one committed current holding, preserving identity/facts/provenance; not acquisition or a freshness judgment.
          headers:
            X-Request-Id:
              required: true
              schema:
                type: string
                format: uuid
            Cache-Control:
              required: true
              schema:
                type: string
                const: private, no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteObservation'
              examples:
                synthetic:
                  summary: Invented data only
                  value:
                    observationId: 22222222-2222-4222-8222-222222222222
                    subject:
                      symbol: SPY
                      securityType: ETF
                    facts:
                      last:
                        price: 100
                      bid:
                        price: 99.9
                      ask:
                        price: 100.1
                    provenance:
                      provider: tradier
                      environment: SANDBOX
                      acquisitionId: 22222222-2222-4222-8222-222222222222
                      authorityEpoch: synthetic-epoch
                      acquisitionPhase: CLOSED
                      receivedAt: '2026-10-15T20:00:00Z'
                      committedAt: '2026-10-15T20:00:00Z'
        '401':
          description: Missing or invalid Bearer credential.
          headers:
            X-Request-Id:
              required: true
              schema:
                type: string
                format: uuid
            Cache-Control:
              required: true
              schema:
                type: string
                const: private, no-store
            WWW-Authenticate:
              required: true
              schema:
                type: string
                const: Bearer
          content:
            application/problem+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/HeldQuoteReadProblem'
                - type: object
                  properties:
                    status:
                      const: 401
                    code:
                      const: UNAUTHENTICATED
              examples:
                synthetic:
                  summary: Invented data only
                  value:
                    type: urn:wheelwright:problem:unauthenticated
                    title: Unauthenticated
                    status: 401
                    code: UNAUTHENTICATED
                    requestId: 11111111-1111-4111-8111-111111111111
                    detail: Synthetic 401 example.
        '403':
          description: Authenticated principal lacks quote.read; acquire/force grants do not imply read.
          headers:
            X-Request-Id:
              required: true
              schema:
                type: string
                format: uuid
            Cache-Control:
              required: true
              schema:
                type: string
                const: private, no-store
          content:
            application/problem+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/HeldQuoteReadProblem'
                - type: object
                  properties:
                    status:
                      const: 403
                    code:
                      const: FORBIDDEN
              examples:
                synthetic:
                  summary: Invented data only
                  value:
                    type: urn:wheelwright:problem:forbidden
                    title: Forbidden
                    status: 403
                    code: FORBIDDEN
                    requestId: 11111111-1111-4111-8111-111111111111
                    detail: Synthetic 403 example.
        '404':
          description: Valid decoded canonical subject has no canonical direct quote held; not a claim that the market symbol does not exist.
          headers:
            X-Request-Id:
              required: true
              schema:
                type: string
                format: uuid
            Cache-Control:
              required: true
              schema:
                type: string
                const: private, no-store
          content:
            application/problem+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/HeldQuoteReadProblem'
                - type: object
                  properties:
                    status:
                      const: 404
                    code:
                      const: NOT_FOUND
              examples:
                synthetic:
                  summary: Invented data only
                  value:
                    type: urn:wheelwright:problem:not_found
                    title: Not found
                    status: 404
                    code: NOT_FOUND
                    requestId: 11111111-1111-4111-8111-111111111111
                    detail: Synthetic 404 example.
        '422':
          description: Invalid path codec token, correlation, any query parameter or nonempty body. Validation occurs after authentication/quote.read.
          headers:
            X-Request-Id:
              required: true
              schema:
                type: string
                format: uuid
            Cache-Control:
              required: true
              schema:
                type: string
                const: private, no-store
          content:
            application/problem+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/HeldQuoteReadProblem'
                - type: object
                  properties:
                    status:
                      const: 422
                    code:
                      const: INVALID_REQUEST
              examples:
                synthetic:
                  summary: Invented data only
                  value:
                    type: urn:wheelwright:problem:invalid_request
                    title: Invalid request
                    status: 422
                    code: INVALID_REQUEST
                    requestId: 11111111-1111-4111-8111-111111111111
                    detail: Synthetic 422 example.
                    invalidParams:
                    - name: request
                      reason: Synthetic invalid input
        '500':
          description: Malformed persisted complete canonical observation or post-start storage/serialization failure; no defaults, repairs, dropped facts or partial observation.
          headers:
            X-Request-Id:
              required: true
              schema:
                type: string
                format: uuid
            Cache-Control:
              required: true
              schema:
                type: string
                const: private, no-store
          content:
            application/problem+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/HeldQuoteReadProblem'
                - type: object
                  properties:
                    status:
                      const: 500
                    code:
                      const: INTERNAL_ERROR
              examples:
                synthetic:
                  summary: Invented data only
                  value:
                    type: urn:wheelwright:problem:internal_error
                    title: Internal error
                    status: 500
                    code: INTERNAL_ERROR
                    requestId: 11111111-1111-4111-8111-111111111111
                    detail: Synthetic 500 example.
        '503':
          description: 'Read cannot start: approved authentication or held storage unavailable. Provider outage alone does not cause this error.'
          headers:
            X-Request-Id:
              required: true
              schema:
                type: string
                format: uuid
            Cache-Control:
              required: true
              schema:
                type: string
                const: private, no-store
          content:
            application/problem+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/HeldQuoteReadProblem'
                - type: object
                  properties:
                    status:
                      const: 503
                    code:
                      const: CAPABILITY_UNAVAILABLE
              examples:
                synthetic:
                  summary: Invented data only
                  value:
                    type: urn:wheelwright:problem:capability_unavailable
                    title: Capability unavailable
                    status: 503
                    code: CAPABILITY_UNAVAILABLE
                    requestId: 11111111-1111-4111-8111-111111111111
                    detail: Synthetic 503 example.
      tags:
      - Quotes
      externalDocs:
        description: Product and domain contract
        url: https://github.com/brooksbol/options-prototype/blob/main/docs/contracts/api-v2-subject-show-held-quote.md
      x-codeSamples:
      - lang: curl
        label: Synthetic cURL
        source: "curl --request GET 'https://api.example.invalid/v2/quotes/SPY' \\\n  --header 'X-Request-Id: 11111111-1111-4111-8111-111111111111'"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >-
        TLS-protected configured credential identifies a persisted immutable User.
        Backend User state authorizes many-to-many Account access and explicit
        administrator privileges independently of IDs, aliases and credentials. The
        POST requires quote.acquire; FORCE additionally requires quote.force. GET
        independently requires quote.read; acquire/force grants do not imply read.
        Deployed operation fails closed without approved configuration.
  responses:
    Problem:
      description: Request-wide failure before trustworthy completed per-subject results.
      headers:
        X-Request-Id:
          required: true
          schema:
            type: string
            format: uuid
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem400:
      description: Request-wide HTTP 400 failure before trustworthy completed per-subject results.
      headers:
        X-Request-Id:
          required: true
          schema:
            type: string
            format: uuid
      content:
        application/problem+json:
          schema:
            allOf:
            - $ref: '#/components/schemas/Problem'
            - type: object
              properties:
                status:
                  const: 400
          examples:
            synthetic:
              summary: Invented data only
              value:
                type: urn:wheelwright:problem:malformed_request
                title: Malformed request
                status: 400
                code: MALFORMED_REQUEST
                requestId: 11111111-1111-4111-8111-111111111111
                detail: Synthetic error example.
    Problem401:
      description: Request-wide HTTP 401 failure before trustworthy completed per-subject results.
      headers:
        X-Request-Id:
          required: true
          schema:
            type: string
            format: uuid
      content:
        application/problem+json:
          schema:
            allOf:
            - $ref: '#/components/schemas/Problem'
            - type: object
              properties:
                status:
                  const: 401
          examples:
            synthetic:
              summary: Invented data only
              value:
                type: urn:wheelwright:problem:unauthenticated
                title: Unauthenticated
                status: 401
                code: UNAUTHENTICATED
                requestId: 11111111-1111-4111-8111-111111111111
                detail: Synthetic error example.
    Problem403:
      description: Request-wide HTTP 403 failure before trustworthy completed per-subject results.
      headers:
        X-Request-Id:
          required: true
          schema:
            type: string
            format: uuid
      content:
        application/problem+json:
          schema:
            allOf:
            - $ref: '#/components/schemas/Problem'
            - type: object
              properties:
                status:
                  const: 403
          examples:
            synthetic:
              summary: Invented data only
              value:
                type: urn:wheelwright:problem:forbidden
                title: Forbidden
                status: 403
                code: FORBIDDEN
                requestId: 11111111-1111-4111-8111-111111111111
                detail: Synthetic error example.
    Problem415:
      description: Request-wide HTTP 415 failure before trustworthy completed per-subject results.
      headers:
