  schemas:
    AcquireQuotesRequest:
      type: object
      additionalProperties: false
      required: [subjects]
      properties:
        subjects:
          type: array
          minItems: 1
          maxItems: 30
          description: >-
            Distinct named US-listed underlying symbols. The server uppercases
            symbols before duplicate detection and preserves request order in results.
            Canonical duplicates make the entire request invalid (422).
          items:
            $ref: '#/components/schemas/RequestedSubject'
        mode:
          type: string
          enum: [ORDINARY, FORCE]
          default: ORDINARY
          description: >-
            ORDINARY may reuse eligible held evidence. FORCE bypasses reuse and
            requires actual permitted upstream contact. FORCE does not override provider-contact restrictions. This is acquisition intent,
            not an observation fact or downstream admissibility verdict.
    RequestedSubject:
      type: object
      additionalProperties: false
      required: [symbol]
      properties:
        symbol:
          type: string
          minLength: 1
          maxLength: 32
          pattern: '^[A-Za-z^][A-Za-z0-9.^/_-]*$'
          description: >-
            Market symbol supplied by caller; canonical uppercase identity is used
            for duplicate detection and returned in each result. Well-formed but
            unsupported symbols receive a per-subject result.
    AcquireQuotesResponse:
      type: object
      additionalProperties: true
      required: [requestId, mode, startedAt, completedAt, results]
      properties:
        requestId:
          type: string
          format: uuid
          description: Request correlation identity, not an idempotency key.
        mode:
          type: string
          enum: [ORDINARY, FORCE]
          description: Effective acquisition intent.
        startedAt:
          type: string
          format: date-time
          description: Wheelwright operation start instant, RFC 3339 UTC.
        completedAt:
          type: string
          format: date-time
          description: Wheelwright operation completion instant, RFC 3339 UTC.
        results:
          type: array
          minItems: 1
          maxItems: 30
          description: Exactly one terminal result per canonical requested subject, in request order.
          items:
            $ref: '#/components/schemas/SubjectAcquisitionResult'
    SubjectAcquisitionResult:
      type: object
      additionalProperties: true
      required: [subject, outcome, fulfilled, observation, priorRetained]
      properties:
        subject:
          $ref: '#/components/schemas/RequestedSubject'
        outcome:
          type: string
          enum:
            - NEWLY_ACQUIRED
            - REUSED
            - UNMATCHED
            - UNSUPPORTED_SUBJECT
            - UPSTREAM_UNAVAILABLE
            - CONTACT_NOT_PERMITTED
            - ADMISSION_REJECTED
            - UPSTREAM_FAILED
            - INVALID_UPSTREAM_EVIDENCE
            - AUTHORITY_SUPERSEDED
            - ACCEPTANCE_FAILED
          description: >-
            This request's terminal fulfillment outcome. NEWLY_ACQUIRED certifies
            accepted authoritative held quote evidence visible before completion;
            REUSED certifies ordinary-policy eligible held evidence.
        fulfilled:
          type: boolean
          description: True exactly for NEWLY_ACQUIRED or REUSED.
        observation:
          oneOf:
            - $ref: '#/components/schemas/QuoteObservation'
            - type: 'null'
          description: >-
            Selected authoritative held canonical direct quote after this subject's
            attempt; null means none. On failure it is retained prior evidence and
            does not fulfill this request. Reuse preserves original identity/clocks.
        priorRetained:
          type: boolean
          description: True exactly when an unfulfilled result has a non-null prior observation.
        failure:
          $ref: '#/components/schemas/SubjectFailure'
          description: Required for unfulfilled results; absent for fulfilled results.
      oneOf:
        - required: [failure]
          properties:
            fulfilled: { const: false }
            outcome:
              enum: [UNMATCHED, UNSUPPORTED_SUBJECT, UPSTREAM_UNAVAILABLE,
                     CONTACT_NOT_PERMITTED, ADMISSION_REJECTED, UPSTREAM_FAILED,
                     INVALID_UPSTREAM_EVIDENCE, AUTHORITY_SUPERSEDED,
                     ACCEPTANCE_FAILED]
        - not: { required: [failure] }
          properties:
            fulfilled: { const: true }
            priorRetained: { const: false }
            outcome: { enum: [NEWLY_ACQUIRED, REUSED] }
    SubjectFailure:
      type: object
      additionalProperties: true
      required: [code, retryable]
      properties:
        code:
          type: string
          enum: [UNMATCHED, UNSUPPORTED_SUBJECT, UPSTREAM_UNAVAILABLE,
                 CONTACT_NOT_PERMITTED, ADMISSION_REJECTED, UPSTREAM_FAILED,
                 INVALID_UPSTREAM_EVIDENCE, AUTHORITY_SUPERSEDED,
                 ACCEPTANCE_FAILED]
          description: Must equal the enclosing result outcome.
        retryable:
          type: boolean
          description: Another attempt might change this condition; no success promise.
        detail:
          type: string
          description: Optional safe human-readable explanation; no credential or raw provider payload.
    QuoteObservation:
      type: object
      additionalProperties: true
      required: [observationId, subject, facts, provenance]
      properties:
        observationId:
          type: string
          format: uuid
          description: Stable Wheelwright identity for this accepted direct-quote observation.
        subject:
          $ref: '#/components/schemas/ResolvedSubject'
        facts:
          $ref: '#/components/schemas/QuoteFacts'
        provenance:
          $ref: '#/components/schemas/QuoteProvenance'
    ResolvedSubject:
      type: object
      additionalProperties: true
      required: [symbol, securityType]
      properties:
        symbol:
          type: string
          description: Canonical uppercase Wheelwright underlying symbol.
        securityType:
          type: string
          enum: [EQUITY, ETF, INDEX, OTHER_UNDERLYING]
          description: Wheelwright-resolved security class; option contracts are excluded.
    QuoteFacts:
      type: object
      additionalProperties: true
      anyOf:
        - required: [last]
          properties:
            last:
              type: object
              required: [price]
              properties:
                price: { type: number, exclusiveMinimum: 0 }
        - required: [bid]
          properties:
            bid:
              type: object
              required: [price]
              properties:
                price: { type: number, exclusiveMinimum: 0 }
        - required: [ask]
          properties:
            ask:
              type: object
              required: [price]
              properties:
                price: { type: number, exclusiveMinimum: 0 }
        - required: [open]
          properties:
            open: { type: number, exclusiveMinimum: 0 }
        - required: [high]
          properties:
            high: { type: number, exclusiveMinimum: 0 }
        - required: [low]
          properties:
            low: { type: number, exclusiveMinimum: 0 }
        - required: [close]
          properties:
            close: { type: number, exclusiveMinimum: 0 }
      description: >-
        Source-reported quote-family facts. Missing facts are omitted, never null,
        synthesized, or relabeled. Previous close and metadata alone do not make
        price-bearing direct-quote evidence.
      properties:
        description: { type: string, description: "Provider-reported instrument description." }
        exchange: { type: string, description: "Provider-reported listing exchange." }
        last: { $ref: '#/components/schemas/TradeFact' }
        bid: { $ref: '#/components/schemas/SideFact' }
        ask: { $ref: '#/components/schemas/SideFact' }
        open: { $ref: '#/components/schemas/Price' }
        high: { $ref: '#/components/schemas/Price' }
        low: { $ref: '#/components/schemas/Price' }
        close: { $ref: '#/components/schemas/Price' }
        previousClose: { $ref: '#/components/schemas/Price' }
        volume: { type: integer, minimum: 0, description: "Provider-reported daily volume, if supplied." }
        reportedChange: { type: number, description: "Provider-reported price change, not Wheelwright-derived." }
        reportedChangePercent: { type: number, description: "Provider-reported change normalized to percentage points (1.5 means 1.5 percent), not Wheelwright-derived." }
        averageVolume: { type: integer, minimum: 0, description: "Provider-reported average daily volume." }
        fiftyTwoWeekHigh: { $ref: '#/components/schemas/Price' }
        fiftyTwoWeekLow: { $ref: '#/components/schemas/Price' }
    Price:
      type: number
      minimum: 0
      description: Nonnegative source-reported market price in the instrument's applicable unit.
    TradeFact:
      type: object
      additionalProperties: true
      required: [price]
      properties:
        price: { $ref: '#/components/schemas/Price' }
        size: { type: integer, minimum: 0, description: "Provider-reported last trade size." }
        sourceEventAt: { type: string, format: date-time, description: "Provider last-trade event instant, RFC 3339 UTC when known." }
    SideFact:
      type: object
      additionalProperties: true
      required: [price]
      properties:
        price: { $ref: '#/components/schemas/Price' }
        size: { type: integer, minimum: 0, description: "Provider-reported displayed side size." }
        venue: { type: string, description: "Provider-reported bid or ask exchange." }
        sourceEventAt: { type: string, format: date-time, description: "Provider side-specific event instant, RFC 3339 UTC when known." }
    QuoteProvenance:
      type: object
      additionalProperties: true
      required: [provider, environment, acquisitionId, authorityEpoch, acquisitionPhase, receivedAt, committedAt]
      properties:
        provider: { type: string, minLength: 1, description: "Source provider identity, e.g. tradier." }
        environment:
          type: string
          enum: [PRODUCTION, SANDBOX]
          description: Provider data environment, not client deployment environment.
        acquisitionId: { type: string, format: uuid, description: "Wheelwright identity of the accepted upstream attempt." }
        authorityEpoch: { type: string, minLength: 1, description: "Opaque Wheelwright fencing identifier for the accepted upstream attempt. Preserve as provenance; not a timestamp or a client sequencing token." }
        acquisitionPhase:
          type: string
          enum: [REGULAR_USABLE, PRE_MARKET, POST_MARKET, CLOSED, UNKNOWN]
          description: Wheelwright classification at upstream contact, not a provider event time or evidence-admissibility verdict.
        regularSessionDate:
          type: string
          format: date
          description: Applicable US regular-session calendar date when unambiguously known; absent otherwise.
        feedIdentity:
          type: string
          description: Stable source-feed identity relevant to authority/reuse; absent only when source does not distinguish feeds.
        receivedAt: { type: string, format: date-time, description: "Wheelwright receipt instant of this subject's upstream evidence, RFC 3339 UTC." }
        committedAt: { type: string, format: date-time, description: "Wheelwright authoritative held-evidence acceptance instant, RFC 3339 UTC." }
    Problem:
      type: object
      additionalProperties: true
      required: [type, title, status, code, requestId]
      properties:
        type: { type: string, format: uri-reference, description: "Stable problem-type identifier." }
        title: { type: string, description: "Stable short reason." }
        status: { type: integer, enum: [400, 401, 403, 415, 422, 500, 503] }
        detail: { type: string, description: "Optional safe human-readable detail." }
        instance: { type: string, format: uri-reference, description: "Optional occurrence URI." }
        code:
          type: string
          enum: [MALFORMED_REQUEST, UNAUTHENTICATED, FORBIDDEN,
                 UNSUPPORTED_MEDIA_TYPE, INVALID_REQUEST, CAPABILITY_UNAVAILABLE,
                 INTERNAL_ERROR]
          description: Machine-readable request-wide failure code.
        requestId: { type: string, format: uuid, description: "Correlates logs and response; not an idempotency key." }
        invalidParams:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name, reason]
            properties:
              name: { type: string, description: "JSON Pointer into request where applicable." }
              reason: { type: string, description: "Safe human-readable validation failure." }
      oneOf:
      - type: object
        properties:
          status: { const: 400 }
          code: { const: MALFORMED_REQUEST }
          title: { const: Malformed request }
          type: { const: 'urn:wheelwright:problem:malformed_request' }
      - type: object
        properties:
          status: { const: 401 }
          code: { const: UNAUTHENTICATED }
          title: { const: Unauthenticated }
          type: { const: 'urn:wheelwright:problem:unauthenticated' }
      - type: object
        properties:
          status: { const: 403 }
          code: { const: FORBIDDEN }
          title: { const: Forbidden }
          type: { const: 'urn:wheelwright:problem:forbidden' }
      - type: object
        properties:
          status: { const: 415 }
          code: { const: UNSUPPORTED_MEDIA_TYPE }
          title: { const: Unsupported media type }
          type: { const: 'urn:wheelwright:problem:unsupported_media_type' }
      - type: object
        properties:
          status: { const: 422 }
          code: { const: INVALID_REQUEST }
          title: { const: Invalid request }
          type: { const: 'urn:wheelwright:problem:invalid_request' }
          invalidParams: { type: array, minItems: 1 }
        required: [invalidParams]
      - type: object
        properties:
          status: { const: 500 }
          code: { const: INTERNAL_ERROR }
          title: { const: Internal error }
          type: { const: 'urn:wheelwright:problem:internal_error' }
      - type: object
        properties:
          status: { const: 503 }
          code: { const: CAPABILITY_UNAVAILABLE }
          title: { const: Capability unavailable }
          type: { const: 'urn:wheelwright:problem:capability_unavailable' }
    HeldQuotesReadResponse:
      type: object
      additionalProperties: true
      required:
      - requestId
      - items
      properties:
        requestId:
          type: string
          format: uuid
          description: This read request correlation, equal to X-Request-Id; not acquisition/observation identity.
        items:
          type: array
          minItems: 0
          description: Complete current holdings, one per subject, uppercase ordinal symbol ascending. No
            maxItems, POST cap, silent truncation, history or continuation.
          items:
            $ref: '#/components/schemas/HeldQuoteDiscoveryItem'
    HeldQuoteDiscoveryItem:
      type: object
      additionalProperties: true
      required:
      - observationId
      - subject
      - provenance
      description: Bounded discovery summary. All defined fields required and non-null. No quote facts, acquisition
        result, deeper provenance or state verdict.
      properties:
        observationId:
          type: string
          format: uuid
          description: Original accepted observation identity. Reading preserves it; replacement selects a
            different observation even if numeric facts match.
        subject:
          $ref: '#/components/schemas/HeldQuoteDiscoverySubject'
        provenance:
          $ref: '#/components/schemas/HeldQuoteDiscoveryProvenance'
    HeldQuoteDiscoverySubject:
      allOf:
      - $ref: '#/components/schemas/ResolvedSubject'
      - type: object
        properties:
          symbol:
            type: string
            minLength: 1
            maxLength: 32
            pattern: ^[A-Z^][A-Z0-9.^/_-]*$
      description: Existing Wheelwright resolved underlying security vocabulary; canonical uppercase symbol.
        No option contracts or membership requirement.
    HeldQuoteDiscoveryProvenance:
      type: object
      additionalProperties: true
      required:
      - provider
      - environment
      - receivedAt
      - committedAt
      description: Only persisted source identity and distinct original receipt/commit clocks. No acquisition
        ID, epoch, phase, session or feed detail.
      properties:
        provider:
          type: string
          minLength: 1
          description: Persisted source provider identity, not Wheelwright endpoint.
        environment:
          type: string
          enum:
          - PRODUCTION
          - SANDBOX
          description: Persisted provider data environment, independent of current active authority or client
            deployment.
        receivedAt:
          type: string
          format: date-time
          pattern: Z$
          description: Original Wheelwright receipt instant of this accepted upstream subject evidence; not
            a source market-event time. RFC 3339 UTC with Z; original stored instant and fractional precision,
            never rewritten by read.
        committedAt:
          type: string
          format: date-time
          pattern: Z$
          description: Original Wheelwright persistence-commit/authoritative acceptance instant; not source-event,
            publication, read or operation time. RFC 3339 UTC with Z; original stored instant and fractional
            precision, never rewritten by read.
    HeldQuotesReadProblem:
      allOf:
      - $ref: '#/components/schemas/Problem'
      description: RFC 9457 request-wide failure; no result data or partial inventory. Header/body requestId
        agree. No Retry-After promise.
      oneOf:
      - type: object
        properties:
          status:
            const: 401
          code:
            const: UNAUTHENTICATED
          title:
            const: Unauthenticated
          type:
            const: urn:wheelwright:problem:unauthenticated
      - type: object
        properties:
          status:
            const: 403
          code:
            const: FORBIDDEN
          title:
            const: Forbidden
          type:
            const: urn:wheelwright:problem:forbidden
      - type: object
        properties:
          status:
            const: 422
          code:
            const: INVALID_REQUEST
          title:
            const: Invalid request
          type:
            const: urn:wheelwright:problem:invalid_request
          invalidParams:
            type: array
            minItems: 1
        required:
        - invalidParams
      - type: object
        properties:
          status:
            const: 500
          code:
            const: INTERNAL_ERROR
          title:
            const: Internal error
          type:
            const: urn:wheelwright:problem:internal_error
      - type: object
        properties:
          status:
            const: 503
          code:
            const: CAPABILITY_UNAVAILABLE
          title:
            const: Capability unavailable
          type:
            const: urn:wheelwright:problem:capability_unavailable
    EncodedQuoteSymbol:
      type: string
      minLength: 1
      maxLength: 96
      pattern: ^(?:[A-Z]|_5E)(?:[A-Z0-9.-]|_(?:2F|5E|5F)){0,31}(?![\s\S])
      description: 'Canonical transport only: copy uppercase letters/digits/period/hyphen; slash _2F, underscore
        _5F, caret _5E. Exactly one representation and one decoding, no repairs or unnecessary/lowercase escapes.
        Decoded identity matches [A-Z^][A-Z0-9.^/_-]{0,31} and remains the persisted/returned/provider symbol.
        No connector change.'
    HeldQuoteReadProblem:
      type: object
      additionalProperties: true
      required:
      - type
      - title
      - status
      - code
      - requestId
      properties:
        type:
          type: string
          format: uri-reference
          description: Stable problem-type identifier.
        title:
          type: string
          description: Stable short reason.
        status:
          type: integer
          enum:
          - 401
          - 403
          - 404
          - 422
          - 500
          - 503
        detail:
          type: string
          description: Optional safe human-readable detail.
        instance:
          type: string
          format: uri-reference
          description: Optional occurrence URI.
        code:
          type: string
          enum:
          - UNAUTHENTICATED
          - FORBIDDEN
          - NOT_FOUND
          - INVALID_REQUEST
          - INTERNAL_ERROR
          - CAPABILITY_UNAVAILABLE
          description: Machine-readable request-wide failure code.
        requestId:
          type: string
          format: uuid
          description: Correlates logs and response; not an idempotency key.
        invalidParams:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - name
            - reason
            properties:
              name:
                type: string
                description: JSON Pointer into request where applicable.
              reason:
                type: string
                description: Safe human-readable validation failure.
      description: RFC 9457 singular held-read failure. Header/body requestId agree; no result data. NOT_FOUND
        detail states no canonical direct quote is held for decoded canonical subject.
      oneOf:
      - type: object
        properties:
          status:
            const: 401
          code:
            const: UNAUTHENTICATED
          title:
            const: Unauthenticated
          type:
