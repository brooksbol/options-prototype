openapi: 3.1.1
info:
  title: Wheelwright v2 financial domain and source evidence
  version: 0.6.0-foundational
  description: >-
    Authoritative specification: accepted synchronous POST acquisition plus the
    Principal-selected GET held-discovery and canonical path-token instance-read
    capabilities, plus the Principal-accepted foundational financial domain, token User/Account discovery,
    independent custody observations, immutable Construction history, read-only Orders, qualified evaluations
    and retained source Artifacts. Full API runtime acceptance remains a separate gate.
    The historical filename is retained. Implementation authority
    comes from the separately accepted Product contract and bounded handoff.
externalDocs:
  description: Repository contract entry point and semantic authority
  url: https://github.com/brooksbol/options-prototype/blob/main/docs/api-v2/README.md
servers:
  - url: /
tags:
- name: Accounts
  description: Account identity and broker association.
- name: Users
  description: User identity and capability metadata.
- name: Positions
  description: Independently identified economic Positions; broker custody is separately readable.
- name: Portfolio capital
  description: Qualified capital composites from retained sources.
- name: Artifacts
  description: Exact source retention, metadata and CSV processing.
- name: Transactions
  description: Account-nested transaction evidence and coverage.
- name: Market evidence
  description: Backend selection of relevant subjects.
- name: Quotes
  description: Explicit acquisition and provider-free held-evidence reads.
