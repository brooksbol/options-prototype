# Wheelwright Evidence Service — Configuration
# Port matches the frontend proxy target
server.port=3100

# SQLite database path (Wheelwright-owned, at repository root)
evidence.db.path=${EVIDENCE_DB_PATH:../data/evidence.sqlite3}

# Universe seed CSV path (Wheelwright-owned, at repository root)
universe.seed.path=${UNIVERSE_SEED_PATH:../data/seeds/yahoo-merged-etf-tickers.csv}

# Provider configuration (loaded from environment)
tradier.api-key=${TRADIER_API_KEY:}
tradier.base-url=${TRADIER_BASE_URL:https://sandbox.tradier.com/v1}
# Exact local request-start budget over a trailing 60-second window.
# Production market data is documented at 120/min; operator-authorized target is 119.
tradier.requests-per-minute=${TRADIER_REQUESTS_PER_MINUTE:119}

# Measurement-only, after-hours provider harness. Disabled by default; when
# false, Spring does not expose its endpoint at all. This does not alter the
# normal acquisition session gate or write provider results to Wheelwright.
measurement.after-hours-provider-test-enabled=${WHEELWRIGHT_AFTER_HOURS_MEASUREMENT:false}
