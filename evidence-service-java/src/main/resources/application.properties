# Wheelwright Evidence Service — Configuration
# Port matches the frontend proxy target
server.port=3100

# SQLite database path (Wheelwright-owned, at repository root)
evidence.db.path=${EVIDENCE_DB_PATH:../data/evidence.sqlite3}

# Universe seed CSV path (Wheelwright-owned, at repository root)
universe.seed.path=${UNIVERSE_SEED_PATH:../data/seeds/yahoo-merged-etf-tickers.csv}

# Provider configuration (loaded from environment)
tradier.api-key=${TRADIER_API_KEY:}
tradier.base-url=${TRADIER_BASE_URL:https://sandbox.tradier.com/v1}
# Provider request rate (req/sec). Default 0.9 (~54/min) is safe for SANDBOX (60/min).
# Production allows 120/min — set TRADIER_RATE_PER_SEC to ~1.6 (~96/min, with headroom) when live.
tradier.rate-per-sec=${TRADIER_RATE_PER_SEC:0.9}
