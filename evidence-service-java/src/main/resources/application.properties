# Wheelwright Evidence Service — Configuration
# Port matches the TypeScript evidence-service for drop-in replacement
server.port=3100

# SQLite database path
evidence.db.path=${EVIDENCE_DB_PATH:./data/evidence.sqlite3}

# Universe seed CSV path (empty string = disable seeding)
# Default references the canonical seed in the repository
universe.seed.path=${UNIVERSE_SEED_PATH:../evidence-service/data/seeds/yahoo-merged-etf-tickers.csv}

# Provider configuration (loaded from environment)
tradier.api-key=${TRADIER_API_KEY:}
tradier.base-url=${TRADIER_BASE_URL:https://sandbox.tradier.com/v1}
