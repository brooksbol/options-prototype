name: Architectural fitness
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  composed-capability:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.18.0'
      - name: Install pinned consumers
        run: |
          npm ci --prefix tools/talk --ignore-scripts
          npm ci --prefix tools/mcp-v2-evidence --ignore-scripts
          npm ci --prefix tools/mcp-account-question --ignore-scripts
          npm ci --prefix tools/mcp-hello-world --ignore-scripts
          npm ci --prefix tools/api-docs --ignore-scripts
          tools/api-docs/node_modules/.bin/playwright install --with-deps chromium
          cd evidence-service-java
          ./gradlew testClasses --no-daemon
      - name: Prove composition and reject disconnection or omitted evidence
        run: |
          node scripts/architectural-fitness.mjs run --receipt "$RUNNER_TEMP/fitness.json"
