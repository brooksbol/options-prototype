name: API v2 documentation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/api-v2-pages.yml'
      - 'tools/api-docs/**'
      - 'scripts/v2_oas.py'
      - 'scripts/v2-oas-conformance-test.py'
      - 'docs/contracts/api-v2-*'
      - 'docs/api-v2/**'
      - 'docs/cli/ww-account-evidence.md'
      - 'evidence-service-java/src/main/java/com/wheelwright/evidence/v2/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/api-v2-pages.yml'
      - 'tools/api-docs/**'
      - 'scripts/v2_oas.py'
      - 'scripts/v2-oas-conformance-test.py'
      - 'docs/contracts/api-v2-*'
      - 'docs/api-v2/**'
      - 'docs/cli/ww-account-evidence.md'
      - 'evidence-service-java/src/main/java/com/wheelwright/evidence/v2/**'
  workflow_dispatch:

permissions: {}
concurrency:
  group: api-v2-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      html_sha: ${{ steps.identity.outputs.html_sha }}
      licenses_sha: ${{ steps.identity.outputs.licenses_sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.18.0'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.15'
      - name: Install pinned tools
        run: |
          npm install --global npm@11.16.0 --ignore-scripts
          npm ci --prefix tools/api-docs --ignore-scripts
          python -m pip install -r tools/api-docs/requirements.txt
          tools/api-docs/node_modules/.bin/playwright install --with-deps chromium
      - name: Validate contracts and build
        env:
          PUBLISH: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        run: |
          python scripts/v2-oas-conformance-test.py
          if [ "$PUBLISH" = true ]; then
            python tools/api-docs/build.py --publish
          else
            python tools/api-docs/build.py
          fi
          python tools/api-docs/validate.py
          node tools/api-docs/human-specimen.mjs
      - name: Stage exact public allowlist and record identity
        id: identity
        run: |
          mkdir "$RUNNER_TEMP/api-pages"
          install -m 644 tools/api-docs/dist/site/index.html "$RUNNER_TEMP/api-pages/index.html"
          install -m 644 tools/api-docs/dist/site/LICENSES.txt "$RUNNER_TEMP/api-pages/LICENSES.txt"
          python - <<'PY'
          import json, os
          from pathlib import Path
          m = json.loads(Path('tools/api-docs/dist/private/provenance.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              print('html_sha=' + m['publicFiles']['index.html'], file=out)
              print('licenses_sha=' + m['publicFiles']['LICENSES.txt'], file=out)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              print('Validated source: `' + m['sourceCommit'] + '`', file=out)
              print('Accepted preview: `' + m['acceptedPreviewSha256'] + '`', file=out)
              print('Publication date: ' + str(m['publicationDate']), file=out)
              for name, digest in m['publicFiles'].items():
                  print('- ' + name + ': `' + digest + '`', file=out)
          PY
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: ${{ runner.temp }}/api-pages
          retention-days: 1

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy validated artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Verify live file identities
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          HTML_SHA: ${{ needs.build.outputs.html_sha }}
          LICENSES_SHA: ${{ needs.build.outputs.licenses_sha }}
        run: |
          python3 - <<'PY'
          import hashlib, os, time, urllib.request
          for filename, expected in [('index.html', os.environ['HTML_SHA']), ('LICENSES.txt', os.environ['LICENSES_SHA'])]:
              for attempt in range(12):
                  try:
                      url = os.environ['PAGE_URL'].rstrip('/') + '/' + filename
                      with urllib.request.urlopen(url + '?deployment=' + os.environ['GITHUB_SHA'], timeout=15) as response:
                          actual = hashlib.sha256(response.read()).hexdigest()
                      if actual != expected:
                          raise ValueError(filename + ' live hash differs from validated artifact')
                      print(filename + ' verified: ' + actual)
                      break
                  except Exception:
                      if attempt == 11:
                          raise
                      time.sleep(5)
          PY
